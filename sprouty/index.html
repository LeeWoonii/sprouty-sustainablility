<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Sprouty</title>
<link rel="stylesheet" href="../libs/bootstrap/css/bootstrap.min.css">
<style>
:root{--leaf:#1f6b4a;--sun:#ffc83d;--water:#2b8fd1}
body{background:#e2f3ee;color:#1d2b24;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:640px}
h1{font-size:1.7rem;color:var(--leaf);font-weight:800}
.panel{background:#fff;border:3px solid var(--leaf);border-radius:18px;padding:14px}
#stage{background:linear-gradient(#bfe6ff 0 62%,#9bd66f 62%);border-radius:14px;padding:10px 10px 6px;text-align:center}
#mascot svg{width:170px;height:187px}
#decor{font-size:2rem;min-height:2.6rem;letter-spacing:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #dde}
.row2:last-child{border:0}
textarea,input{width:100%;border:2px solid var(--leaf);border-radius:10px;padding:8px;font-family:monospace}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--water);outline-offset:2px}
</style>
</head>
<body>
<main class="container py-3">
  <a href="../index.html" class="btn btn-sm btn-outline-success mb-2">Back to Sprouty</a>
  <section class="panel text-center">
    <h1>My Sprouty</h1>
    <div id="stage"><div id="mascot"></div><div id="decor" aria-label="Your garden"></div></div>
    <p id="level" class="fw-bold mt-2 mb-0"></p>
    <p class="fw-bold mb-0">🌰 <span id="coins"></span> seeds &nbsp;·&nbsp; 🔥 Streak: <span id="streak"></span> week(s)</p>
  </section>
  <div class="tabs" id="tabs"></div>
  <section class="panel" id="view" aria-live="polite"></section>
</main>
<script src="../libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../shared/sprouty-core.js"></script>
<script src="sprouty.js"></script>
</body>
</html>
